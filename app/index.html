<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-184551494-1"></script>
    <script>
     window.dataLayer = window.dataLayer || [];
     function gtag(){
         // tony add to avoid polluting analytics
         if (location.hostname == "localhost") {console.log('not logging: ', arguments); return;}
         dataLayer.push(arguments);
     }
     gtag('js', new Date());
     gtag('config', 'UA-184551494-1');
    </script>
    
    <title>BrainTool Topic Manager</title>
    <!-- title/lang updated by i18n after init -->
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"
            integrity="sha256-CSXorXvZcTkaix6Yvo6HppcZGetbYMGWSFlBw8HfCJo="
            crossorigin="anonymous">
    </script>
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
    <script src="jquery.treetable.js"></script>

    <link href="bt.css" rel="stylesheet" type="text/css" />
    <link href="jquery.treetable.css" rel="stylesheet" type="text/css" />
    <link href="wenk.css" rel="stylesheet" />  <!-- tooltip lib -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
  </head>
  <body>
      <!-- #controlsHeader is now generated by applicationUI.js -->
      <!-- #settings panel is now generated by applicationUI.js -->
      <!-- #actions panel is now generated by applicationUI.js -->
      <!-- #help panel is now generated by applicationUI.js -->
      
    <div id="loading">
      <p id="loadingMessage" style="text-align: center; margin-top:500px" data-i18n-html="loadingMessage">
        <br/>Loading your BrainTool file<br/>...</p>
    </div>
    
    <!-- #buttonRow is now generated by rowManager.js -->
    
    <img id="backgroundLogo" type="image" src="resources/backgroundLogo.svg">
    
    <table id="content" >
    </table>

    <!-- #messageContainer is now generated by messageManager.js -->
    <!-- #footer is now generated by applicationUI.js -->
    
    <div id="editOverlay">
      <dialog id="dialog" >
            <div id="distinguishedName"></div>

            <div id="topic">
                <input type="text" id="topicName" class="editNode" tabindex="1" data-i18n-aria="topicAria" aria-label="Topic">
                <span id="newTopicNameHint" class="hint" data-i18n="nameTheTopic">Name the Topic</span>
            </div>
            <input type="text" id="titleText" class="editNode" tabindex="1" data-i18n-aria="titleAria" aria-label="Title" value='title'>
            <textarea id="titleUrl" class="editNode" tabindex="2" data-i18n-aria="urlAria" aria-label="URL">url</textarea>
            <textarea id="textText" class="editNode" tabindex="3" data-i18n-aria="noteAria" aria-label="Note"></textarea>

            <div class="buttonDiv" style="display:flex; justify-content: space-between; margin-top: 10px;">
                <button id="cancel" class="editNode" tabindex="5" onClick="closeDialog(cancelEdit)" data-i18n="cancel">Cancel</button>
                <button id="update" class="editNode" tabindex="4" onClick="updateRow()" data-i18n="update">Update</button>
            </div>
      </dialog>

      <dialog id="permissions" style="display:none; top: 100px">
        <p data-i18n-html="permissionsLocal">BrainTool needs to re-establish local file access.<br/>The browser will now ask for your permission.</p>
        <button id="grant" data-i18n="ok">OK</button>
      </dialog>
      
      <!-- #intro slideshow is now generated by messageManager.js -->

    </div>
    
    <script src="orga-bundlev2.js"></script>
    <script src="../utilities/converters.js"></script>
    
    <!-- Initialize UI components before loading bt.js -->
    <script type="module">
        import { initI18n, t, applyStaticDom } from './i18n.js';
        import { initializeControlsHeader, initializeSettings, initializeActions, initializeHelp, initializeFooter } from './applicationUI.js';
        import { initializeMessageContainer, initializeIntro } from './messageManager.js';
        import { initializeButtonRow } from './rowManager.js';

        // Prefer stored language (chrome.storage or later config); fall back to browser locale
        let storedLocale = null;
        try {
            if (typeof chrome !== 'undefined' && chrome.storage?.local) {
                const v = await chrome.storage.local.get(['BTLocale']);
                if (v.BTLocale) storedLocale = v.BTLocale;
            }
        } catch { /* not in extension context */ }
        initI18n(storedLocale);
        // Fixed English title so extension can find this window via chrome.tabs.query
        document.title = 'BrainTool Topic Manager';
        applyStaticDom(document);

        // Generate UI components (use t() at generation time)
        initializeControlsHeader();
        initializeSettings();
        initializeActions();
        initializeHelp();
        initializeMessageContainer();
        initializeIntro();
        initializeButtonRow();
        initializeFooter();
    </script>
    
    <script type="module" src="bt.js"></script>
    
    <!-- Window shim for inline event handlers -->
    <script type="module">
        // Import functions that are still used in inline event handlers in index.html
        // These will be removed as we continue refactoring (edit dialog)
        import { closeDialog, cancelEdit, updateRow } from './rowManager.js';
        
        // Expose to global window object for inline handlers still in HTML
        // Edit dialog handlers
        window.closeDialog = closeDialog;
        window.cancelEdit = cancelEdit;
        window.updateRow = updateRow;
    </script>
  </body>
</html>
