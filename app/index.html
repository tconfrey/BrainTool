<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-184551494-1"></script>
    <script>
     window.dataLayer = window.dataLayer || [];
     function gtag(){
         // tony add to avoid polluting analytics
         if (location.hostname == "localhost") {console.log('not logging: ', arguments); return;}
         dataLayer.push(arguments);
     }
     gtag('js', new Date());
     gtag('config', 'UA-184551494-1');
    </script>
    
    <title>BrainTool Topic Manager</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"
            integrity="sha256-CSXorXvZcTkaix6Yvo6HppcZGetbYMGWSFlBw8HfCJo="
            crossorigin="anonymous">
    </script>
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
    <script src="jquery.treetable.js"></script>

    <link href="bt.css" rel="stylesheet" type="text/css" />
    <link href="jquery.treetable.css" rel="stylesheet" type="text/css" />
    <link href="wenk.css" rel="stylesheet" />  <!-- tooltip lib -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
  </head>
  <body>
      <!-- #controlsHeader is now generated by applicationUI.js -->
      <!-- #settings panel is now generated by applicationUI.js -->
      <!-- #actions panel is now generated by applicationUI.js -->
      <!-- #help panel is now generated by applicationUI.js -->
      
    <div id="loading">
      <p id="loadingMessage" style="text-align: center; margin-top:500px">
        <br/>Loading your BrainTool file<br/>...</p>
    </div>
    
    <!-- #buttonRow is now generated by rowManager.js -->
    
    <img id="backgroundLogo" type="image" src="resources/backgroundLogo.svg">
    
    <table id="content" >
    </table>

    <!-- #messageContainer is now generated by messageManager.js -->
    <!-- #footer is now generated by applicationUI.js -->
    
    <!-- #editOverlay, #dialog and #permissions are now generated by editDialogManager.js -->
    
    <script src="orga-bundlev2.js"></script>
    <script src="../utilities/converters.js"></script>
    
    <!-- Initialize UI components before loading bt.js -->
    <script type="module">
        import { initializeControlsHeader, initializeSettings, initializeActions, initializeHelp, initializeFooter } from './applicationUI.js';
        import { initializeMessageContainer, initializeIntro } from './messageManager.js';
        import { initializeButtonRow } from './rowManager.js';
        import { initializeEditDialog } from './editDialogManager.js';
        // Generate UI components
        initializeEditDialog();         // first: #editOverlay hosts #intro and #buttonRow's parking spot
        initializeControlsHeader();
        initializeSettings();
        initializeActions();
        initializeHelp();
        initializeMessageContainer();
        initializeIntro();
        initializeButtonRow();
        initializeFooter();
    </script>
    
    <script type="module" src="bt.js"></script>

  </body>
</html>
